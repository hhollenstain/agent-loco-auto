[project]
name = "agent-loco"
version = "0.1.0"
description = "Home-lab coding agent that improves projects, tests locally, and publishes green commits."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Henry Hollenstain" }]
dependencies = [
    "openai>=1.60",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "playwright>=1.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
browser = [
    "playwright>=1.49",
]

[project.scripts]
loco = "agent_loco.cli:app"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_loco = ["templates/*.html", "static/*.css", "static/*.svg", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]